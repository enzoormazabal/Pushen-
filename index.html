<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para Pushen ❤️</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #eadcff;
  font-family: Arial, sans-serif;
  text-align: center;
}
.card {
  padding: 30px;
  max-width: 380px;
}
h1 {
  color: #54352f;
  font-size: 36px;
}
.cat {
  font-size: 125px;
  margin: 25px;
}
p {
  color: #754b69;
  font-size: 20px;
}
.heart {
  color: #f477a5;
  font-size: 48px;
  animation: beat 1s infinite;
}
@keyframes beat {
  50% { transform: scale(1.25); }
}
</style>
</head>
<body>
<div class="card">
  <h1>Te amo mucho Pushen ❤️</h1>
  <div class="cat">🐱</div>
  <p>Esta sorpresa es solamente para ti.</p>
  <div class="heart">♥</div>
</div>
</body>
</html>
